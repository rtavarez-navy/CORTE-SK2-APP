name: Pruebas y compilacion Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias y pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-backend.txt pytest httpx
          python -m pytest -q
          python -m compileall -q backend integrations desktop
  windows-exe:
    needs: backend-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Empaquetar ejecutable
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name CORTE-SK2 desktop/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: CORTE-SK2-Windows-V0.1
          path: dist/CORTE-SK2.exe
          if-no-files-found: error
